<div class="container">
  <h2>Update Census Record</h2>

  <form [formGroup]="censusForm" (ngSubmit)="onUpdate()">

    <div class="form-group">
      <label>Number of People in Household</label>
      <input type="text" class="form-control" formControlName="people_in_household">
    </div>

    <div class="form-group">
      <label>Street</label>
      <input type="text" class="form-control" formControlName="street">
    </div>

    <div class="form-group">
      <label>City</label>
      <input type="text" class="form-control" formControlName="city">
    </div>

    <div class="form-group">
      <label>State</label>
      <input type="text" class="form-control" formControlName="state">
    </div>

    <div class="form-group">
      <label>Zip Code</label>
      <input type="text" class="form-control" formControlName="zip">
    </div>

    <div class="form-group">
      <label>Year of the Census</label>
      <input type="text" class="form-control" formControlName="year">
    </div>

    <div class="form-group">
      <label>Census Taker's Name</label>
      <input type="text" class="form-control" formControlName="census_taker">
    </div>

    <button type="submit" class="btn btn-primary">Update Census Record</button>

  </form>
</div>
